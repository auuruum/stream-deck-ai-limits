<!DOCTYPE html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<link rel="stylesheet" href="settings.css" />
		<title>Codex Usage Settings</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body data-provider="codex">
		<!--
			Settings auto-persist to the action via the `setting` attribute and apply live in the
			plugin (onDidReceiveSettings). Components: https://sdpi-components.dev/docs/components
		-->
		<sdpi-item label="Refresh every">
			<div class="number-setting">
				<input type="number" data-number-setting="refreshIntervalSec" data-default="120" min="60" max="600" step="1" value="120" aria-label="Refresh interval in seconds" />
				<span class="number-setting-unit">sec</span>
				<small class="number-setting-error" role="status"></small>
			</div>
		</sdpi-item>

		<sdpi-item label="Display mode">
			<sdpi-select setting="displayMode" default="used">
				<option value="remaining">Remaining</option>
				<option value="used">Used</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<small id="display-mode-help" style="color: var(--sdpi-color-muted, #999);"></small>
		</sdpi-item>

		<sdpi-item label="Warning at">
			<div class="number-setting">
				<input type="number" data-number-setting="warningThreshold" data-default="70" min="0" max="100" step="1" value="70" aria-label="Warning threshold in percent" />
				<span class="number-setting-unit">%</span>
				<small class="number-setting-error" role="status"></small>
			</div>
		</sdpi-item>

		<sdpi-item label="Critical at">
			<div class="number-setting">
				<input type="number" data-number-setting="criticalThreshold" data-default="90" min="0" max="100" step="1" value="90" aria-label="Critical threshold in percent" />
				<span class="number-setting-unit">%</span>
				<small class="number-setting-error" role="status"></small>
			</div>
		</sdpi-item>

		<sdpi-item label="Credentials path">
			<sdpi-textfield setting="customCredentialsPath" placeholder="Default: ~/.codex/auth.json"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item>
			<small style="color: var(--sdpi-color-muted, #999);">
				Leave the path empty to use the default Codex credentials location.
			</small>
		</sdpi-item>
		<script src="numeric-settings.js"></script>
		<script src="display-mode.js"></script>
	</body>
</html>
